{% extends "base.html" %} {% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <p class="meta">Published on {{ post.created_at }}</p>
  <div class="content">{{ post.content | replace("\n", "<br />") | safe }}</div>
</article>
<a href="{{ url_for('index') }}">← Back to home</a>
{% endblock %}
