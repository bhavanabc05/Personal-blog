{% extends "base.html" %}
{% block content %}
  <div class="admin-header">
    <h1>Dashboard</h1>
    <a href="{{ url_for('add_article') }}" class="btn">+ New Article</a>
  </div>

  <table>
    <thead><tr><th>Title</th><th>Date</th><th>Actions</th></tr></thead>
    <tbody>
      {% for post in posts %}
        <tr>
          <td>{{ post.title }}</td>
          <td>{{ post.created_at }}</td>
          <td>
            <a href="{{ url_for('edit_article', post_id=post.id) }}">Edit</a>
            <form method="POST" action="{{ url_for('delete_article', post_id=post.id) }}"
                  style="display:inline" onsubmit="return confirm('Delete this article?')">
              <button type="submit" class="danger">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
